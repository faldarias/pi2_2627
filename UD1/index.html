<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UD1 - Gestión de proyectos</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1d4ed8;
        --primary-dark: #1e3a8a;
        --text: #1f2937;
        --muted: #64748b;
        --border: #dbe3f0;
        --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1200px;
        margin: 48px auto;
        padding: 0 20px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--primary-dark);
        font-size: clamp(2rem, 3vw, 2.7rem);
      }

      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 1.1rem;
      }

      .infografia {
        width: 100%;
        max-width: 1000px;
        display: block;
        margin: 20px auto 28px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #f8fbff;
        box-shadow: 0 8px 20px rgba(29, 78, 216, 0.08);
      }

      .section-title {
        margin: 8px 0 14px;
        color: var(--primary-dark);
        font-size: 1.5rem;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      li {
        background: #f8fbff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Unidad Didáctica 1</h1>
        <p class="subtitle">Gestión de proyectos</p>

        <img
          class="infografia"
          src="Infografia-ud1-Gestión_de_proyectos.png"
          alt="Infografía de la unidad didáctica 1 sobre gestión de proyectos"
        />

        <h2 class="section-title">Recursos</h2>
        <ul>
          <li><a href="podcast-ud1-gestionproyectos.m4a">Podcast de la unidad</a></li>
          <li><a href="ud1-gestionproyecto.html">Documento HTML</a></li>
          <li><a href="ud1-gestionproyecto.md">Documento Markdown</a></li>
          <li><a href="ud1-gestionproyecto.pdf">Versión PDF</a></li>
          <li><a href="ud1-presentacion-gestionproyecots.pdf">Presentación PDF</a></li>
          <li><a href="ud1-presentacion-gestionproyecots.pptx">Presentación PowerPoint</a></li>
        </ul>
      </div>
    </div>
  </body>
</html>
