<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-labelledby="title desc">
  <title id="title">Metodología híbrida</title>
  <desc id="desc">Diagrama que muestra que la metodología híbrida combina enfoques ágiles y tradicionales.</desc>
  <defs>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 18px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .box1 { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .box2 { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .box3 { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569" />
    </marker>
  </defs>

  <text x="450" y="35" text-anchor="middle" class="title">Metodología híbrida</text>

  <rect x="70" y="80" width="220" height="90" rx="16" class="box1"/>
  <text x="180" y="120" text-anchor="middle" class="label">Tradicional</text>
  <text x="180" y="148" text-anchor="middle" class="small">planificación</text>
  <text x="180" y="170" text-anchor="middle" class="small">y control</text>

  <rect x="340" y="80" width="220" height="90" rx="16" class="box2"/>
  <text x="450" y="120" text-anchor="middle" class="label">Ágil</text>
  <text x="450" y="148" text-anchor="middle" class="small">iteración</text>
  <text x="450" y="170" text-anchor="middle" class="small">y adaptación</text>

  <path d="M290 125 H340" class="arrow"/>
  <path d="M560 125 H610" class="arrow"/>

  <rect x="610" y="80" width="220" height="90" rx="16" class="box3"/>
  <text x="720" y="120" text-anchor="middle" class="label">Híbrida</text>
  <text x="720" y="148" text-anchor="middle" class="small">Agile + Tradicional</text>
  <text x="720" y="170" text-anchor="middle" class="small">equilibrio</text>
</svg>
